[package]
name = "yzchat-crypto"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Quantum-resistant hybrid cryptography for yzchat"
repository = "https://github.com/yzchat/yzchat"
authors = ["yzchat contributors <dev@yzchat.org>"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
# Classical
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
p256 = { workspace = true }
# Post-Quantum (ML-KEM / ML-DSA) - using pqcrypto crates
pqcrypto-kyber = { workspace = true }
pqcrypto-dilithium = { workspace = true }
pqcrypto-traits = { workspace = true }

# Noise protocol framework
snow = "0.9"

[features]
default = ["std"]
std = []