[package]
name = "yzchat-media"
version = "0.1.0"
edition = "2021"
description = "Media engine for yzchat: audio/video calls and screenshare"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }

opus = { workspace = true }

yzchat-crypto = { path = "../yzchat-crypto" }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", features = ["invocation"] }
android_logger = "0.15"

[features]
default = ["std"]
std = []
