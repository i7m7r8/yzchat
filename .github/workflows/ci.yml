name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '35'
  NDK_VERSION: '27.0.12077973'

jobs:
  # ============================================
  # Rust Checks
  # ============================================
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

  # ============================================
  # Android Build
  # ============================================
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: rust-check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.NDK_VERSION }}
          cmdline-tools-version: 'latest'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust for Android
        run: |
          cd yzchat-ffi
          cargo ndk \
            --target aarch64-linux-android \
            --target x86_64-linux-android \
            --platform 24 \
            -- build --release --features android

      - name: Copy JNI libs
        run: |
          mkdir -p yzchat-android/app/src/main/jniLibs/arm64-v8a
          mkdir -p yzchat-android/app/src/main/jniLibs/x86_64
          cp yzchat-ffi/target/aarch64-linux-android/release/libyzchat_ffi.so yzchat-android/app/src/main/jniLibs/arm64-v8a/
          cp yzchat-ffi/target/x86_64-linux-android/release/libyzchat_ffi.so yzchat-android/app/src/main/jniLibs/x86_64/

      - name: Generate UniFFI bindings
        run: |
          cd yzchat-ffi
          cargo install uniffi_bindgen --locked
          cargo run --bin uniffi-bindgen generate --library target/aarch64-linux-android/release/libyzchat_ffi.so --language kotlin --out-dir ../yzchat-android/app/src/main/java

      - name: Build Android App (Debug)
        run: |
          cd yzchat-android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Build Android App (Release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd yzchat-android
          ./gradlew assembleRelease --no-daemon -x lint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yzchat-debug-apk
          path: yzchat-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: yzchat-release-apk
          path: yzchat-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

  # ============================================
  # Security Audit
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit --workspace

      - name: Check for outdated dependencies
        run: cargo install cargo-outdated --locked && cargo outdated --workspace --root-deps-only

  # ============================================
  # Documentation
  # ============================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: target/doc
          retention-days: 30

  # ============================================
  # Release
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android-build, security-audit]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: yzchat-release-apk
          path: release/

      - name: Generate Changelog
        run: |
          cat > CHANGELOG.md << 'EOF'
          # yzchat ${{ github.ref_name }}

          ## Changes
          - See commit history for details

          ## Downloads
          - [APK (arm64)](./yzchat-${{ github.ref_name }}-arm64.apk)
          - [APK (x86_64)](./yzchat-${{ github.ref_name }}-x86_64.apk)

          ## Verification
          EOF
          sha256sum release/*.apk >> CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.apk
            CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Nightly Build
  # ============================================
  nightly:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust for Android (Nightly)
        run: |
          cd yzchat-ffi
          cargo ndk \
            --target aarch64-linux-android \
            --target x86_64-linux-android \
            --platform 24 \
            -- build --release --features android

      - name: Copy JNI libs
        run: |
          mkdir -p yzchat-android/app/src/main/jniLibs/arm64-v8a
          mkdir -p yzchat-android/app/src/main/jniLibs/x86_64
          cp yzchat-ffi/target/aarch64-linux-android/release/libyzchat_ffi.so yzchat-android/app/src/main/jniLibs/arm64-v8a/
          cp yzchat-ffi/target/x86_64-linux-android/release/libyzchat_ffi.so yzchat-android/app/src/main/jniLibs/x86_64/

      - name: Generate UniFFI bindings
        run: |
          cd yzchat-ffi
          cargo install uniffi_bindgen --locked
          cargo run --bin uniffi-bindgen generate --library target/aarch64-linux-android/release/libyzchat_ffi.so --language kotlin --out-dir ../yzchat-android/app/src/main/java

      - name: Build Android App (Nightly)
        run: |
          cd yzchat-android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Upload Nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: yzchat-nightly-apk
          path: yzchat-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7