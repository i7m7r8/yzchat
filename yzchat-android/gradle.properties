# Project-wide Gradle settings
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
# More details: http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:parallel_execution
org.gradle.parallel=true

# Enable configuration cache for faster builds
org.gradle.configuration-cache=true

# AndroidX package structure
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Kotlin settings
kotlin.code.style=official

# KSP incremental processing
ksp.incremental=true

# Room schema location
room.schemaLocation=$projectDir/schemas

# Compose compiler
kotlin.compiler.execution.strategy=in-process

# NDK
android.ndkVersion=27.0.12077973

# Version
yzchat.version=1.0.0
yzchat.versionCode=1