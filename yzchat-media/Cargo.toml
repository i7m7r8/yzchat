[package]
name = "yzchat-media"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Media engine for yzchat: WebRTC, audio/video capture, encoding"
repository = "https://github.com/yzchat/yzchat"
authors = ["yzchat contributors <dev@yzchat.org>"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }

# WebRTC
webrtc = { workspace = true, features = ["data-channel", "sctp"] }
sdp = { workspace = true }

# GStreamer for media pipeline
gstreamer = { workspace = true, features = ["v1_20"] }
gstreamer-app = { workspace = true, features = ["v1_20"] }
gstreamer-video = { workspace = true, features = ["v1_20"] }
gstreamer-audio = { workspace = true, features = ["v1_20"] }
gstreamer-base = { workspace = true, features = ["v1_20"] }
gstreamer-pbutils = { workspace = true, features = ["v1_20"] }
gstreamer-webrtc = { workspace = true, features = ["v1_20"] }
gstreamer-sdp = { workspace = true, features = ["v1_20"] }

# Codecs
opus = { workspace = true }
rav1e = { workspace = true }
dav1d = { workspace = true }

# Android
jni = { workspace = true }
android_logger = { workspace = true }

# Crypto for DTLS-SRTP
yzchat-crypto = { path = "../yzchat-crypto" }

[features]
default = ["std"]
std = []
android = ["jni", "android_logger"]