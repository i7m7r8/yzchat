[workspace]
resolver = "2"
members = [
    "crates/yzchat-crypto",
    "crates/yzchat-p2p",
    "crates/yzchat-media",
    "crates/yzchat-ui",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "tracing"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
dashmap = "5.5"
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }

# Crypto (versions pinned so rand_core matches x25519-dalek/elliptic_curve)
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
rand = { version = "0.8" }   # rand_core 0.6, matches x25519-dalek/elliptic_curve
zeroize = "1.7"
subtle = "2.5"
# Post-quantum (NIST PQC)
pqcrypto-kyber = { version = "0.8" }
pqcrypto-dilithium = { version = "0.5" }
pqcrypto-traits = { version = "0.3" }

# P2P / Networking (serverless, QUIC + DHT + NAT traversal)
iroh = { version = "0.28", default-features = false, features = [
    "discovery-pkarr-dht",
    "discovery-local-network",
    "fs-store",
] }

# Media
opus = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"

[profile.release-lto]
inherits = "release"
lto = "fat"
