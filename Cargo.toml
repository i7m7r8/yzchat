[workspace]
resolver = "2"
members = [
    "yzchat-crypto",
    "yzchat-p2p",
    "yzchat-media",
    "yzchat-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "yzchat — Pure P2P messenger, quantum-resistant, zero infrastructure"
repository = "https://github.com/yzchat/yzchat"
authors = ["yzchat contributors <dev@yzchat.org>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
futures = "0.3"
parking_lot = "0.12"
dashmap = "5.5"
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Crypto
p256 = { version = "0.13", features = ["pkcs8", "ecdsa", "sha256"] }
ed25519-dalek = "2.1"
x25519-dalek = "2.1"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
rand = { version = "0.8", features = ["rngs", "std"] }
zeroize = "1.7"
subtle = "2.5"
# Post-quantum (hybrid)
ml-kem = { version = "0.2", features = ["kyber768"] }        # Kyber-768 (ML-KEM-768)
ml-dsa = { version = "0.2", features = ["dilithium3"] }       # Dilithium3 (ML-DSA-65)
# Note: Use pqcrypto crates when ml-kem/ml-dsa stabilize; fallback to oqs or liboqs-sys for now

# P2P / Networking
iroh = { version = "0.43", features = ["docs", "discovery-dht", "discovery-mdns", "discovery-n0", "blobs", "rpc"] }
# iroh provides: QUIC transport, DHT (kademlia), blobs, RPC, WebRTC via iroh-webrtc (future)
# For now: iroh + webrtc via iroh-webrtc when available
quinn = "0.11"
quinn-proto = "0.11"
rustls = { version = "0.23", features = ["dangerous-configuration", "logging", "std"] }
rustls-pemfile = "1.0"
rcgen = "0.11"
sdp = "0.3"

# Media
webrtc = { version = "0.12", features = ["data-channel", "sctp"] }  # webrtc-rs
gstreamer = { version = "0.21", features = ["v1_20", "gstreamer", "gstreamer-app", "gstreamer-video", "gstreamer-audio", "gstreamer-base", "gstreamer-pbutils"] }
gstreamer-app = "0.21"
gstreamer-video = "0.21"
gstreamer-audio = "0.21"
gstreamer-base = "0.21"
gstreamer-pbutils = "0.21"
gstreamer-webrtc = "0.21"
gstreamer-sdp = "0.21"
opus = "0.5"
rav1e = "0.7"
dav1d = "0.9"

# FFI / UniFFI
uniffi = { version = "0.28", features = ["async"] }
uniffi_macros = "0.28"

# Android
jni = { version = "0.21", features = ["jni-8"] }
android_logger = "0.16"
log = "0.4"

# Storage
sled = { version = "0.34", features = ["compression", "zstd"] }
redb = "0.1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid", "json"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"

[profile.release-lto]
inherits = "release"
lto = "fat"

# Android-specific dependencies are defined per-crate in their respective Cargo.toml files