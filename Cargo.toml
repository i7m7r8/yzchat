[workspace]
resolver = "2"
members = [
    "yzchat-crypto",
    "yzchat-p2p",
    "yzchat-media",
    "yzchat-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "yzchat — Pure P2P messenger, quantum-resistant, zero infrastructure"
repository = "https://github.com/yzchat/yzchat"
authors = ["yzchat contributors <dev@yzchat.org>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
futures = "0.3"
parking_lot = "0.12"
dashmap = "5.5"
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Crypto
p256 = { version = "0.13", features = ["pkcs8", "ecdsa", "sha256"] }
ed25519-dalek = "2"
x25519-dalek = "2"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
rand = { version = "0.8", features = ["rngs", "std"] }
zeroize = "1.7"
subtle = "2.5"
# Post-quantum (hybrid) - using pqcrypto crates (stable alternatives to ML-KEM/ML-DSA)
pqcrypto-kyber = { version = "0.8" }      # Kyber-768 (ML-KEM-768)
pqcrypto-dilithium = { version = "0.5" } # Dilithium3 (ML-DSA-65)
pqcrypto-traits = { version = "0.3" }

# P2P / Networking
iroh = { version = "0.28.1", features = ["discovery-pkarr-dht", "discovery-local-network", "fs-store"] }
# iroh provides: QUIC transport, DHT (kademlia), blobs, RPC, WebRTC via iroh-webrtc (future)
# For now: iroh + webrtc via iroh-webrtc when available
quinn = "0.11"
quinn-proto = "0.11"
rustls = { version = "0.23", features = ["dangerous-configuration", "logging", "std"] }
rustls-pemfile = "1.0"
rcgen = "0.11"
sdp = "0.3"

# Media
webrtc = { version = "0.20" }  # webrtc-rs (uses runtime-tokio by default)
gstreamer = { version = "0.21", features = ["v1_20"] }
gstreamer-app = { version = "0.21", features = ["v1_20"] }
gstreamer-video = { version = "0.21", features = ["v1_20"] }
gstreamer-audio = { version = "0.21", features = ["v1_20"] }
gstreamer-base = { version = "0.21", features = ["v1_20"] }
gstreamer-pbutils = { version = "0.21", features = ["v1_20"] }
gstreamer-webrtc = { version = "0.21", features = ["v1_20"] }
gstreamer-sdp = { version = "0.21", features = ["v1_20"] }
opus = "0.4"
rav1e = "0.7"
dav1d = "0.9"

# FFI / UniFFI
uniffi = { version = "0.28" }
uniffi_macros = "0.28"
uniffi_build = "0.28"

# Android
jni = { version = "0.21", features = ["invocation"] }
android_logger = "0.15"
log = "0.4"

# Storage
sled = { version = "0.34", features = ["compression", "zstd"] }
redb = "0.1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid", "json"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"

[profile.release-lto]
inherits = "release"
lto = "fat"

# Android-specific dependencies are defined per-crate in their respective Cargo.toml files