[package]
name = "yzchat-ffi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "UniFFI bindings for yzchat: Kotlin ↔ Rust FFI"
repository = "https://github.com/yzchat/yzchat"
authors = ["yzchat contributors <dev@yzchat.org>"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Core crates
yzchat-crypto = { path = "../yzchat-crypto" }
yzchat-p2p = { path = "../yzchat-p2p" }
yzchat-media = { path = "../yzchat-media" }

[build-dependencies]
uniffi_build = { workspace = true }

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["std"]
std = []
android = ["yzchat-media/android"]