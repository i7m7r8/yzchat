[package]
name = "yzchat-ffi"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "UniFFI bindings for yzchat: Kotlin ↔ Rust FFI"
repository = { workspace = true }
authors = { workspace = true }

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Core crates
yzchat-crypto = { path = "../yzchat-crypto" }
yzchat-p2p = { path = "../yzchat-p2p" }
yzchat-media = { path = "../yzchat-media" }

[build-dependencies]
uniffi_build = { workspace = true }
uniffi_build_macros = { workspace = true }

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["std"]
std = []