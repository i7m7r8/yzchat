[package]
name = "yzchat-p2p"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "P2P networking layer for yzchat using Iroh"
repository = "https://github.com/yzchat/yzchat"
authors = ["yzchat contributors <dev@yzchat.org>"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Iroh P2P stack
iroh = { workspace = true, features = ["discovery-dht", "discovery-mdns", "discovery-n0", "blobs", "rpc", "docs"] }

# QUIC/WebRTC
quinn = { workspace = true }
webrtc = { workspace = true }
sdp = { workspace = true }

# Crypto
yzchat-crypto = { path = "../yzchat-crypto" }

# Storage
sled = { workspace = true }
redb = { workspace = true }

[features]
default = ["std"]
std = []